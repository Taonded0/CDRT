<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dice Rugby Tactics</title>
<style>
  body {
    font-family: 'Arial Black', Arial, sans-serif;
    background-color: #111;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 2px;
    box-sizing: border-box;
    overflow: hidden;
  }

  #game-title {
    font-size: 11px;
    color: #ffffff;
    margin: 1px 0;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 2px 4px;
    background: #1f1f1f;
    border-radius: 3px;
    border: 1px solid #444;
  }

  #game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 320px;
    margin: 0 auto;
    gap: 2px;
  }

  #board-wrapper {
    position: relative;
    width: 280px;
    height: 195px;
    background-color: #1b4d3e;
    border: 2px solid #ffffff;
    box-sizing: border-box;
    margin: 0 auto;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
  }

  .ingoal-header {
    width: 100%;
    height: 26px;
    background-color: #8b0000;
    position: relative;
    box-sizing: border-box;
    border-bottom: 2px solid #ffffff;
    flex-shrink: 0;
  }

  .goal-post {
    position: absolute;
    width: 28px;
    height: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    bottom: -2px; 
  }

  .goal-post::before, .goal-post::after {
    content: '';
    position: absolute;
    bottom: 0;
    width: 2px;
    height: 100%;
    background-color: #ffffff;
  }
  .goal-post::before { left: 0; }
  .goal-post::after { right: 0; }

  .goal-post .crossbar {
    position: absolute;
    top: 45%;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: #ffffff;
    transform: translateY(-50%);
  }

  #field-container {
    position: relative;
    width: 100%;
    flex-grow: 1;
    background-color: #1b4d3e;
    overflow: visible;
  }

  .v-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background-color: rgba(255, 255, 255, 0.4);
    z-index: 2;
  }

  .h-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.4);
    z-index: 2;
  }
  .h-line.dashed { 
    border-top: 1.5px dashed #ffffff; 
    background: none; 
    height: 0; 
    z-index: 3;
  }

  .line-label {
    position: absolute;
    left: 4px;
    font-size: 8px;
    color: #ffffff;
    font-weight: bold;
    transform: translateY(-50%);
    z-index: 4;
    text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
  }

  #ball-token {
    position: absolute;
    width: 15px;
    height: 10px;
    border-radius: 50%;
    transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 3px rgba(0,0,0,0.8);
    z-index: 10;
  }
  .team-red { background-color: #d32f2f; border: 1.5px solid #fff; }

  #controls {
    width: 280px;
    background: #1f1f1f;
    padding: 4px 6px;
    border-radius: 4px;
    box-sizing: border-box;
    border: 1px solid #444;
    font-family: Arial, sans-serif;
  }

  .control-row {
    display: flex;
    gap: 4px;
    margin-bottom: 2px;
    align-items: stretch;
  }

  .control-col-left {
    width: 105px;
    background: #111;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 2px 4px;
    font-size: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    text-align: left;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .control-col-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    text-align: left;
    background: #161616;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 3px 5px;
    box-sizing: border-box;
  }

  .status-item {
    display: flex;
    justify-content: space-between;
  }
  
  .channel-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  
  label { font-size: 8px; color: #ffcc00; font-weight: bold; }
  
  .help-btn {
    background: #b71c1c;
    color: #fff;
    font-size: 7px;
    padding: 1px 4px;
    border-radius: 3px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    width: auto;
    margin: 0;
  }
  .help-btn:hover { background: #880e4f; }

  select, button {
    font-size: 9.5px; padding: 3px 4px; border-radius: 3px; border: none; width: 100%; box-sizing: border-box;
  }
  select { background: #333; color: #fff; margin-bottom: 6px; border: 1px solid #555; }
  
  button:not(.help-btn) { 
    background-color: #c62828; 
    color: white; 
    font-weight: bold; 
    cursor: pointer; 
    padding: 4px 4px;
    letter-spacing: 0.5px;
  }
  button:not(.help-btn):hover { background-color: #b71c1c; }
  button:disabled { background-color: #555; cursor: not-allowed; }
  
  #dice-result-container {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 100%;
    margin: 2px 0;
    box-sizing: border-box;
  }
  
  #dice-color-box {
    width: 20px;
    height: 18px;
    border-radius: 3px;
    border: 1px solid #fff;
    background-color: #333;
    flex-shrink: 0;
  }

  #dice-text-box {
    flex-grow: 1;
    height: 18px;
    border-radius: 3px;
    border: 1px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 8.5px;
    background-color: #fff;
    color: #000;
  }

  #log { font-size: 8px; color: #ffffff; min-height: 18px; background: #111; padding: 2px 3px; border-radius: 3px; text-align: left; font-family: Arial, sans-serif; box-sizing: border-box; overflow-y: auto;}

  #modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #modal-content {
    background: #222;
    border: 2px solid #b71c1c;
    border-radius: 6px;
    width: 300px;
    max-height: 85vh;
    padding: 8px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    text-align: left;
  }
  #modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #444;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }
  #modal-title {
    font-size: 11px;
    color: #ffffff;
    font-weight: bold;
  }
  .close-btn {
    background: #b71c1c;
    color: #fff;
    border: none;
    border-radius: 3px;
    font-size: 10px;
    padding: 1px 5px;
    cursor: pointer;
    width: auto;
    margin: 0;
  }
  #modal-body {
    font-size: 9px;
    overflow-y: auto;
    max-height: 260px;
    line-height: 1.3;
  }
  .channel-guide-item {
    background: #2a2a2a;
    margin-bottom: 4px;
    padding: 4px;
    border-radius: 3px;
    border-left: 3px solid #b71c1c;
  }
  .channel-guide-name {
    font-weight: bold;
    color: #fff;
    margin-bottom: 2px;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="game-title">Dice Rugby Tactics</div>

  <div id="board-wrapper">
    <div class="ingoal-header">
      <div class="goal-post"><div class="crossbar"></div></div>
    </div>
    <div id="field-container">
      <div class="v-line" style="left: 10%;"></div>
      <div class="v-line" style="left: 30%;"></div>
      <div class="v-line" style="left: 50%;"></div>
      <div class="v-line" style="left: 70%;"></div>
      <div class="v-line" style="left: 90%;"></div>
      <div id="ball-token" class="team-red"></div>
    </div>
  </div>

  <div id="controls">
    <div class="control-row">
      <div class="control-col-left">
        <div class="status-item"><span>挑戦回数:</span> <span id="try-count" style="font-weight:bold;">1</span></div>
        <div class="status-item"><span>フェイズ:</span> <span id="phase-num" style="color:#ffffff; font-weight:bold;">1/10</span></div>
        <div class="status-item"><span>TRY数:</span> <span id="score-tries" style="color:#ffffff; font-weight:bold;">0</span></div>
      </div>

      <div class="control-col-right">
        <div class="channel-header-row">
          <label>アタックチャンネル</label>
          <button class="help-btn" onclick="openChannelModal()">❓ 表を確認</button>
        </div>
        <select id="channel-select"></select>
        <button id="roll-btn" onclick="executePlay()">Use it !</button>
      </div>
    </div>

    <div id="dice-result-container">
      <div id="dice-color-box"></div>
      <div id="dice-text-box">-</div>
    </div>

    <div id="log">10フェイズ以内にトライを獲りきれ！</div>
  </div>
</div>

<div id="modal-overlay" onclick="closeChannelModal(event)">
  <div id="modal-content" onclick="event.stopPropagation()">
    <div id="modal-header">
      <span id="modal-title">アタックチャンネル表</span>
      <button class="close-btn" onclick="closeChannelModal()">✕ 閉じる</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
  const COLORS_META = [
    { name: '赤', key: 'red', hex: '#d32f2f' },
    { name: '青', key: 'blue', hex: '#1976d2' },
    { name: '黄', key: 'yellow', hex: '#fbc02d' },
    { name: '紫', key: 'purple', hex: '#732E7E' },
    { name: '緑', key: 'green', hex: '#388e3c' },
    { name: '橙', key: 'orange', hex: '#f57c00' }
  ];

  const PASS_TABLE = {
    'Point':   { red: {val: 0, label: '0'}, blue: {val: 0, label: '0'}, yellow: {val: 0, label: '0'},  purple: {val: 1, label: '1'},  green: {val: 1, label: '1'},  orange: {val: 0, label: '0'} },
    'Inside':  { red: {val: -1, label: '-1'}, blue: {val: -1, label: '-1'},yellow: {val: 0, label: '0'},  purple: {val: 1, label: '1'},  green: {val: 1, label: '1'},  orange: {val: 1, label: '1'} },
    'Middle':  { red: {val: 2, label: '2'}, blue: {val: -1, label: '-1'},yellow: {val: -1, label: '-1'}, purple: {val: 0, label: '0'},  green: {val: 1, label: '1'},  orange: {val: '1op', isOffload: true, label: '1 オフロードパス'} },
    'Short':   { red: {val: 1, label: '1'}, blue: {val: 3, isCNB: true, label: '3 (クリーンブレイク！)'}, yellow: {val: -1, label: '-1'},purple: {val: -1, label: '-1'}, green: {val: 0, label: '0'},  orange: {val: 0, label: '0'} },
    'Outside': { red: {val: 1, label: '1'}, blue: {val: 2, label: '2'}, yellow: {val: 4, isCNB: true, label: '4 (クリーンブレイク！)'}, purple: {val: -2, label: '-2'}, green: {val: -1, label: '-1'}, orange: {val: 0, label: '0'} },
    'Edge':    { red: {val: 0, label: '0'}, blue: {val: '1a', isKickPass: true, label: '1 アドバンテージ (キックパス)'}, yellow: {val: 3, label: '3'},  purple: {val: 5, isCNB: true, label: '5 (クリーンブレイク！)'}, green: {val: 'TO', isTO: true, label: 'TO'}, orange: {val: -2, label: '-2'} }
  };

  const TOTAL_LINES = 13; 
  let linePositionsY = [];
  let ballX = 2; 
  let ballY = 10; 
  let currentPhase = 1;
  let maxPhases = 10;
  let totalTries = 0;
  let tryAttemptCount = 1;
  let hasCleanBreak = false;

  let currentAvailableOptions = [];
  const X_POS = [10, 30, 50, 70, 90];

  function setupBoard() {
    linePositionsY = new Array(TOTAL_LINES);
    const container = document.getElementById('field-container');
    container.innerHTML = '';

    ['10%', '30%', '50%', '70%', '90%'].forEach(leftPos => {
      const vLine = document.createElement('div');
      vLine.className = 'v-line';
      vLine.style.left = leftPos;
      container.appendChild(vLine);
    });

    const token = document.createElement('div');
    token.id = 'ball-token';
    token.className = 'team-red';
    container.appendChild(token);

    for (let i = 0; i < TOTAL_LINES; i++) {
      linePositionsY[i] = (i / (TOTAL_LINES - 1)) * 100;
    }

    for (let i = 0; i < TOTAL_LINES; i++) {
      const hLine = document.createElement('div');
      if (i === 0) {
        hLine.className = 'h-line';
        hLine.style.top = '0px';
      } else if (i === TOTAL_LINES - 2) {
        hLine.className = 'h-line dashed';
        hLine.style.top = linePositionsY[i] + '%';
      } else if (i === TOTAL_LINES - 1) {
        continue;
      } else {
        hLine.className = 'h-line';
        hLine.style.top = linePositionsY[i] + '%';
      }
      container.appendChild(hLine);
    }

    const label22 = document.createElement('div');
    label22.className = 'line-label';
    label22.innerText = '22m';
    label22.style.top = linePositionsY[TOTAL_LINES - 2] + '%';
    container.appendChild(label22);

    updateAvailableChannels();
    updateDisplayImmediate();
  }

  function updateAvailableChannels() {
    const channelSelect = document.getElementById('channel-select');
    channelSelect.innerHTML = '';
    
    if (ballX === 0) {
      currentAvailableOptions = [
        { label: 'Point (左EL)', x: 0, key: 'Point' },
        { label: 'Inside (左HL)', x: 1, key: 'Inside' },
        { label: 'Middle (CL)', x: 2, key: 'Middle' },
        { label: 'Outside (右HL)', x: 3, key: 'Outside' },
        { label: 'Edge (右EL)', x: 4, key: 'Edge' }
      ];
    } else if (ballX === 4) {
      currentAvailableOptions = [
        { label: 'Point (右EL)', x: 4, key: 'Point' },
        { label: 'Inside (右HL)', x: 3, key: 'Inside' },
        { label: 'Middle (CL)', x: 2, key: 'Middle' },
        { label: 'Outside (左HL)', x: 1, key: 'Outside' },
        { label: 'Edge (左EL)', x: 0, key: 'Edge' }
      ];
    } else if (ballX === 1) {
      currentAvailableOptions = [
        { label: 'Short (左EL)', x: 0, key: 'Short' },
        { label: 'Point (左HL)', x: 1, key: 'Point' },
        { label: 'Inside (CL)', x: 2, key: 'Inside' },
        { label: 'Middle (右HL)', x: 3, key: 'Middle' },
        { label: 'Outside (右EL)', x: 4, key: 'Outside' }
      ];
    } else if (ballX === 3) {
      currentAvailableOptions = [
        { label: 'Short (右EL)', x: 4, key: 'Short' },
        { label: 'Point (右HL)', x: 3, key: 'Point' },
        { label: 'Inside (CL)', x: 2, key: 'Inside' },
        { label: 'Middle (左HL)', x: 1, key: 'Middle' },
        { label: 'Outside (左EL)', x: 0, key: 'Outside' }
      ];
    } else {
      currentAvailableOptions = [
        { label: 'Point (CL)', x: 2, key: 'Point' },
        { label: 'Inside (左HL)', x: 1, key: 'Inside' },
        { label: 'Inside (右HL)', x: 3, key: 'Inside' },
        { label: 'Outside (左EL)', x: 0, key: 'Outside' },
        { label: 'Outside (右EL)', x: 4, key: 'Outside' }
      ];
    }

    currentAvailableOptions.forEach(optData => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify(optData);
      opt.innerText = optData.label;
      channelSelect.appendChild(opt);
    });
  }

  function openChannelModal() {
    const modalBody = document.getElementById('modal-body');
    modalBody.innerHTML = '';

    currentAvailableOptions.forEach(opt => {
      const table = PASS_TABLE[opt.key];
      const div = document.createElement('div');
      div.className = 'channel-guide-item';
      
      let detailsHtml = '';
      COLORS_META.forEach(c => {
        let cell = table[c.key];
        let textColor = (c.key === 'white') ? '#000' : '#fff';
        let displayText = cell.val === '1op' ? '1op' : (cell.val === '1a' ? '1a' : (cell.isCNB ? cell.val + '✨' : cell.label));
        detailsHtml += `<span style="background:${c.hex}; color:${textColor}; padding:1px 3px; border-radius:2px; font-size:8px; width:16px; text-align:center; display:inline-block;" title="${cell.label}">${displayText}</span>`;
      });
      
      div.innerHTML = `
        <div class="channel-guide-name">▶ ${opt.label}</div>
        <div style="display:flex; justify-content:space-between; margin-top:2px;">${detailsHtml}</div>
      `;
      modalBody.appendChild(div);
    });

    document.getElementById('modal-overlay').style.display = 'flex';
  }

  function closeChannelModal() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  function updateDisplayImmediate() {
    const token = document.getElementById('ball-token');
    token.style.transition = 'left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
    token.style.left = X_POS[ballX] + '%';
    token.style.top = linePositionsY[ballY] + '%';
    
    document.getElementById('phase-num').innerText = currentPhase + '/10';
    document.getElementById('try-count').innerText = tryAttemptCount;
    document.getElementById('score-tries').innerText = totalTries;
  }

  function animatePassingMovement(newX, newY, onComplete) {
    const token = document.getElementById('ball-token');
    token.style.transition = 'left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
    const startX = ballX;

    if (startX === newX) {
      token.style.top = linePositionsY[newY] + '%';
      ballY = newY;
      setTimeout(onComplete, 220);
      return;
    }

    let pathXIndices = [];
    let stepDirection = (newX > startX) ? 1 : -1;
    let curr = startX + stepDirection;
    while (curr !== newX) {
      pathXIndices.push(curr);
      curr += stepDirection;
    }
    pathXIndices.push(newX);

    let stepIdx = 0;
    function jumpToNextIntermediateX() {
      if (stepIdx < pathXIndices.length) {
        let intermediateX = pathXIndices[stepIdx];
        token.style.left = X_POS[intermediateX] + '%';
        ballX = intermediateX;
        stepIdx++;
        setTimeout(jumpToNextIntermediateX, 500);
      } else {
        setTimeout(() => {
          token.style.top = linePositionsY[newY] + '%';
          ballY = newY;
          setTimeout(() => { if (onComplete) onComplete(); }, 220);
        }, 120);
      }
    }
    jumpToNextIntermediateX();
  }

  function executePlay() {
    const selectedOption = JSON.parse(document.getElementById('channel-select').value);
    const diceIndex = Math.floor(Math.random() * 6);
    const rolledMeta = COLORS_META[diceIndex];
    const cellData = PASS_TABLE[selectedOption.key][rolledMeta.key];

    const colorBox = document.getElementById('dice-color-box');
    colorBox.style.backgroundColor = rolledMeta.hex;
    
    const textBox = document.getElementById('dice-text-box');
    textBox.innerText = cellData.isKickPass ? '1a (アドバンテージ)' : (cellData.isOffload ? '1op (オフロード)' : cellData.label);
    if(rolledMeta.key === 'white') {
      textBox.style.backgroundColor = '#fff';
      textBox.style.color = '#000';
    } else {
      textBox.style.backgroundColor = '#222';
      textBox.style.color = '#fff';
    }

    const isTO = (cellData.isTO || cellData.label === 'TO');
    const isKickPass = cellData.isKickPass;
    const isOffload = cellData.isOffload;

    let tempSteps = 0;
    let isNextCB = false;
    const result = cellData.val;

    if (typeof result === 'number') {
      tempSteps = result;
      if (cellData.isCNB) isNextCB = true;
    } else if (result === '1a' || result === '1op') {
      tempSteps = 1;
    } else {
      const cleanVal = parseInt(result);
      if (!isNaN(cleanVal)) {
        tempSteps = cleanVal;
        if (cellData.isCNB) isNextCB = true;
      } else {
        tempSteps = 0;
      }
    }

    let logExtra = "";
    if (hasCleanBreak && tempSteps > 0) {
      tempSteps *= 2;
      logExtra = " (⚡ブースト2倍!)";
    }

    if (hasCleanBreak && tempSteps <= 0) {
      hasCleanBreak = false;
      logExtra = " (ブースト終了)";
    }

    if (isNextCB) {
      hasCleanBreak = true;
      logExtra = " 🔥【クリーンブレイク！次からゲイン2倍】";
    }

    let targetY = ballY - tempSteps;
    let targetX = selectedOption.x;

    let isOutside22m = (targetY >= TOTAL_LINES - 1);
    if (isOutside22m) {
      targetY = TOTAL_LINES - 1; 
    }
    if (targetY < 0) targetY = 0;

    lockControls(true);

    animatePassingMovement(targetX, targetY, () => {
      updateAvailableChannels();

      if (checkWinCondition()) return;

      if (isTO) {
        failGame("🔄 ターンオーバー！ボールを奪われました...");
        return;
      }
      if (isOutside22m) {
        failGame("⚠️ 22mラインの外へ押し出されました...");
        return;
      }

      if (isOffload) {
        document.getElementById('log').innerText = `【Middle】➔ 1op！ 1進んでオフロードパス！...`;

        setTimeout(() => {
          const opRoll = Math.floor(Math.random() * 6);

          if (opRoll === 0) {
            failGame("❌ オフロードパス：ハンドリングエラー！攻撃終了です...");
          } else {
            const opGain = opRoll; 
            
            let opTargetY = ballY - opGain;
            let isOpOutside = (opTargetY >= TOTAL_LINES - 1);
            if (isOpOutside) opTargetY = TOTAL_LINES - 1;
            if (opTargetY < 0) opTargetY = 0;

            document.getElementById('log').innerText = `⚡ オフロードパス成功！さらに +${opGain} ゲイン！！`;

            const token = document.getElementById('ball-token');
            ballY = opTargetY;
            token.style.top = linePositionsY[ballY] + '%';

            setTimeout(() => {
              if (isOpOutside) {
                failGame("⚠️ 22mラインの外へ押し出されました...");
                return;
              }
              if (checkWinCondition()) return;

              currentPhase++;
              if (currentPhase > maxPhases) {
                failGame("⏱️ 10フェイズ制限オーバー！");
                return;
              }

              document.getElementById('phase-num').innerText = currentPhase + '/10';
              lockControls(false);
              updateAvailableChannels();
            }, 800);
          }
        }, 500);

        return;
      }

      if (isKickPass && (ballX === 0 || ballX === 4)) {
        const originalEdgeX = ballX;
        const originalY = ballY;
        const targetEdgeX = (originalEdgeX === 0) ? 4 : 0;
        const targetY = 0;

        document.getElementById('log').innerText = `【Edge】➔ 1a！ アドバンテージ！　クロスキックで一発トライを狙う！...`;

        setTimeout(() => {
          document.getElementById('log').innerText = `🏉 逆エッジで待つ味方にクロスキック！`;

          const token = document.getElementById('ball-token');
          token.style.transition = 'left 3.0s cubic-bezier(0.15, 0.85, 0.35, 1), top 3.0s cubic-bezier(0.15, 0.85, 0.35, 1)';
          
          ballX = targetEdgeX;
          ballY = targetY;
          token.style.left = X_POS[ballX] + '%';
          token.style.top = linePositionsY[0] + '%';

          setTimeout(() => {
            const isSuccess = Math.random() < 0.5;

            if (isSuccess) {
              totalTries++;
              document.getElementById('score-tries').innerText = totalTries;
              document.getElementById('log').innerText = `✨ キャッチ成功！見事なクロスキックトライ！！`;
              setTimeout(() => { resetGameSession(); }, 2500);
            } else {
              document.getElementById('log').innerText = `❌ キャッチ失敗... 元のEdgeの位置に戻り、フェイズ1でリスタートします。`;
              
              ballX = originalEdgeX;
              ballY = originalY;
              currentPhase = 1;
              hasCleanBreak = false;
              
              token.style.transition = 'left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
              token.style.left = X_POS[ballX] + '%';
              token.style.top = linePositionsY[ballY] + '%';

              setTimeout(() => {
                lockControls(false);
                updateAvailableChannels();
                updateDisplayImmediate();
                
                document.getElementById('dice-color-box').style.backgroundColor = '#333';
                document.getElementById('dice-text-box').innerText = '-';
                document.getElementById('dice-text-box').style.backgroundColor = '#fff';
                document.getElementById('dice-text-box').style.color = '#000';
              }, 600);
            }
          }, 3000); 
        }, 2000); 

        return;
      }

      currentPhase++;
      document.getElementById('log').innerText = `【${selectedOption.key}】 ➔ [${rolledMeta.name}] ${cellData.label}${logExtra}`;

      if (currentPhase > maxPhases) {
        failGame("⏱️ 10フェイズ制限オーバー！");
        return;
      }

      document.getElementById('phase-num').innerText = currentPhase + '/10';
      lockControls(false);
    });
  }

  function checkWinCondition() {
    if (ballY <= 0) {
      totalTries++;
      document.getElementById('score-tries').innerText = totalTries;
      document.getElementById('log').innerText = `🎉 トライ！`;
      
      lockControls(true);
      setTimeout(() => { resetGameSession(); }, 2500);
      return true;
    }
    return false;
  }

  function failGame(reasonText) {
    document.getElementById('log').innerText = `${reasonText} リスタートします。`;
    lockControls(true);
    setTimeout(() => {
      tryAttemptCount++;
      resetGameSession();
    }, 2500);
  }

  function resetGameSession() {
    ballX = 2;
    ballY = 10; 
    currentPhase = 1;
    hasCleanBreak = false;
    lockControls(false);
    updateAvailableChannels();
    updateDisplayImmediate();
    
    document.getElementById('dice-color-box').style.backgroundColor = '#333';
    document.getElementById('dice-text-box').innerText = '-';
    document.getElementById('dice-text-box').style.backgroundColor = '#fff';
    document.getElementById('dice-text-box').style.color = '#000';
    
    document.getElementById('log').innerText = `再スタート！10フェイズ以内にトライを獲りきれ！`;
  }

  function lockControls(isLock) {
    document.getElementById('roll-btn').disabled = isLock;
    document.getElementById('channel-select').disabled = isLock;
  }

  setupBoard();
</script>
</body>
</html>
